<article class="tarjeta" [class.tarjeta--adoptada]="mascota().adoptada">
  <div class="tarjeta__etiquetas">
    <app-etiqueta [texto]="mascota().especie" />

    @if (mascota().adoptada) {
      <app-etiqueta texto="Adoptada" tono="exito" />
    }
  </div>

  <h2 class="tarjeta__nombre" data-testid="nombre-mascota">{{ mascota().nombre }}</h2>

  <p class="tarjeta__dato">
    <span data-testid="edad-mascota">{{ edadEnTexto() }}</span>
  </p>

  <p class="tarjeta__descripcion">{{ mascota().descripcion }}</p>
</article>
