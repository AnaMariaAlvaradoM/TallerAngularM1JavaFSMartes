<article class="tarjeta">
  <div class="tarjeta__etiquetas">
    <app-etiqueta [texto]="mascota().especie" />

    @if (mascota().adoptada) {
      <app-etiqueta texto="Adoptada" />
    }
  </div>

  <h3 class="tarjeta__nombre" data-testid="nombre-mascota">
    {{ mascota().nombre }}
  </h3>

  <p class="tarjeta__dato" data-testid="edad-mascota">
    {{ edadFormateada() }}
  </p>
</article>
