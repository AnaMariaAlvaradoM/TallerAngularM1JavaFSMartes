<article class="tarjeta">
    <div class="tarjeta__etiquetas">
        <app-etiqueta [texto]="mascota().especie" />
        @if (mascota().adoptada) {
        <app-etiqueta texto="Adoptada" />
        }
    </div>

    <h3 data-testid="nombre-mascota" class="tarjeta__nombre"> {{ mascota().nombre}} </h3>
    <p data-testid="edad-mascota" class="tarjeta__descripcion"> {{ mostrarEdad() }} </p>
</article>
