<h2 class="listado__titulo">Mascotas que buscan hogar</h2>

<div class="listado__grilla">
  @for (mascota of mascotasDisponibles; track mascota.id) {
    <app-tarjeta-mascota
      [mascota]="mascota">
    </app-tarjeta-mascota>
  }
</div>

<a
  data-testid="ir-a-mascotas"
  routerLink="/mascotas">
  Ver todas las mascotas
</a>
