<section>
  @if (mascota(); as encontrada) {
    <h2 data-testid="detalle-nombre">
      {{ encontrada.nombre }}
    </h2>

    <p>{{ encontrada.descripcion }}</p>
  } @else {
    <p data-testid="mascota-no-encontrada">
      Mascota no encontrada
    </p>
  }

  <a routerLink="/mascotas" data-testid="volver-listado">
    Volver al listado
  </a>
</section>
